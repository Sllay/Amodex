name: stage1-runtime

on:
  push:
    branches:
      - stage/1-durable-runtime
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  vertical-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_USER: amodex
          POSTGRES_PASSWORD: amodex
          POSTGRES_DB: amodex_stage1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amodex -d amodex_stage1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      AMODEX_TEST_DATABASE_URL: postgresql://amodex:amodex@127.0.0.1:5432/amodex_stage1
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install pinned uv
        run: python3 -m pip install --disable-pip-version-check uv==0.10.0

      - name: Install pinned Python
        run: uv python install 3.13.5

      - name: Resolve Stage 1 dependency lock
        run: uv lock --python 3.13.5

      - name: Recreate environment from lock
        run: uv sync --python 3.13.5 --extra dev --frozen

      - name: Run contract + Stage 1 deterministic/crash suites
        run: >-
          uv run --python 3.13.5 --extra dev --frozen pytest -q
          tests/unit
          tests/contract
          tests/integration/test_stage1_vertical_slice.py
          tests/integration/test_stage1_crash_recovery.py
          tests/integration/test_stage1_migrations.py
          tests/integration/test_stage1_provider_failures.py

      - name: Run real Gemini durable provider smoke
        run: >-
          uv run --python 3.13.5 --extra dev --frozen pytest -q
          tests/integration/test_stage1_gemini_live.py

      - name: Scan tracked files for configured Gemini secret
        if: env.GEMINI_API_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          if git grep -F -- "$GEMINI_API_KEY" -- . ':!uv.lock'; then
            echo 'Gemini secret value found in tracked content' >&2
            exit 1
          fi
          echo 'tracked-secret scan PASS'

      - name: Persist generated lock on Stage 1 branch
        if: github.event_name == 'push' && github.ref_name == 'stage/1-durable-runtime'
        run: |
          if git diff --quiet -- uv.lock && git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            echo "uv.lock already tracked and unchanged"
            exit 0
          fi
          git config user.name "amodex-stage1-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(stage1): lock runtime dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}
