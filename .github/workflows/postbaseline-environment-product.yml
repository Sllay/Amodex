name: postbaseline-environment-product-runners

on:
  push:
    branches:
      - postbaseline/environment-product-runners-v1
  pull_request:
    branches:
      - main
    paths:
      - 'src/amodex/environments/**'
      - 'src/amodex/storage/environment_product.py'
      - 'src/amodex/runners/**'
      - 'src/amodex/api/**'
      - 'src/amodex/cli.py'
      - 'src/amodex/product/models.py'
      - 'migrations/postbaseline/**'
      - 'tests/unit/test_postbaseline_environment_product.py'
      - 'tests/integration/test_postbaseline_environment_product.py'
      - '.github/workflows/environment-runner.yml'
      - '.github/workflows/postbaseline-environment-product.yml'
      - 'docs/POST_BASELINE_ENVIRONMENT_PRODUCT_RUNNERS_V1.md'

permissions:
  contents: read

env:
  PYTHONNOUSERSITE: '1'

jobs:
  environment-product-runners:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_USER: amodex
          POSTGRES_PASSWORD: amodex
          POSTGRES_DB: amodex_environment_product
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amodex -d amodex_environment_product"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      AMODEX_TEST_DATABASE_URL: postgresql://amodex:amodex@127.0.0.1:5432/amodex_environment_product

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Recreate isolated Python runtime
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_VENV="$RUNNER_TEMP/amodex-uv-bootstrap"
          env -u PYTHONPATH -u PYTHONHOME python3 -m venv "$BOOTSTRAP_VENV"
          env -u PYTHONPATH -u PYTHONHOME "$BOOTSTRAP_VENV/bin/python" -m pip install --disable-pip-version-check uv==0.10.0
          UV_BIN="$BOOTSTRAP_VENV/bin/uv"
          env -u PYTHONPATH -u PYTHONHOME "$UV_BIN" python install 3.13.5
          env -u PYTHONPATH -u PYTHONHOME "$UV_BIN" sync --python 3.13.5 --extra dev --frozen
          echo "UV_BIN=$UV_BIN" >> "$GITHUB_ENV"

      - name: Compile product and runner modules
        shell: bash
        run: |
          set -euo pipefail
          env -u PYTHONPATH -u PYTHONHOME "$UV_BIN" run --python 3.13.5 --frozen \
            python -m compileall -q \
              src/amodex/environments \
              src/amodex/storage/environment_product.py \
              src/amodex/runners \
              src/amodex/api \
              src/amodex/cli.py

      - name: Prove product surfaces do not import Hermes implementation
        shell: bash
        run: |
          set -euo pipefail
          env -u PYTHONPATH -u PYTHONHOME "$UV_BIN" run --python 3.13.5 --frozen python - <<'PY'
          import sys
          import amodex.api.app
          import amodex.cli
          import amodex.runners.client
          import amodex.runners.desktop
          assert 'amodex.runtime.hermes_worker' not in sys.modules
          print('ENVIRONMENT_PRODUCT_HERMES_ISOLATION_OK')
          PY

      - name: Run post-baseline unit and PostgreSQL integration tests
        shell: bash
        run: |
          set -euo pipefail
          env -u PYTHONPATH -u PYTHONHOME "$UV_BIN" run --python 3.13.5 --extra dev --frozen pytest -q \
            tests/unit/test_postbaseline_environment_product.py \
            tests/integration/test_postbaseline_environment_storage.py \
            tests/integration/test_postbaseline_environment_product.py

      - name: Run Stage 6 product compatibility regression
        shell: bash
        run: |
          set -euo pipefail
          env -u PYTHONPATH -u PYTHONHOME "$UV_BIN" run --python 3.13.5 --extra dev --frozen pytest -q \
            tests/integration/test_stage6_product_surfaces.py \
            tests/integration/test_stage6_termux_cli.py

      - name: Verify operational runner workflow does not carry provider keys
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/environment-runner.yml
          grep -q 'workflow_dispatch:' "$workflow"
          grep -q 'job_id:' "$workflow"
          grep -q 'AMODEX_RUNNER_CONTROL_TOKEN' "$workflow"
          if grep -E 'GEMINI_API_KEY|GROQ_API_KEY|OPENROUTER_API_KEY|NVIDIA_API_KEY' "$workflow"; then
            echo 'provider secret must never enter disposable project runner' >&2
            exit 1
          fi
          grep -Fq "TARGET_ENGINE == 'godot'" "$workflow"
          grep -q 'amodex.runners.client claim' "$workflow"
          grep -q 'amodex.runners.client report' "$workflow"
          echo 'RUNNER_WORKFLOW_BOUNDARY_OK'

      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status" >&2
            exit 1
          fi
