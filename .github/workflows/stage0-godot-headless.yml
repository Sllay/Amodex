name: stage0-godot-headless

on:
  push:
    branches:
      - stage/0-feasibility
    paths:
      - '.github/workflows/stage0-godot-headless.yml'
      - 'research/p0-08-godot-headless/**'

permissions:
  contents: read

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_URL: 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
      GODOT_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
      NODE_VERSION: '22.23.4'
      NODE_SHA256: '1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce'
      GODOT_MCP_PACKAGE: '@shin2344234/godot-mcp@0.1.2'
      SERENA_VERSION: '2.1.0'
      FIXTURE: 'research/p0-08-godot-headless/fixture'

    steps:
      - name: Checkout exact Stage 0 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Install exact Godot and Node pins
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          printf '%s  %s\n' "$GODOT_SHA256" "$RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"

          NODE_ARCHIVE="node-v${NODE_VERSION}-linux-x64.tar.xz"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$NODE_ARCHIVE" \
            "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_ARCHIVE}"
          printf '%s  %s\n' "$NODE_SHA256" "$RUNNER_TEMP/$NODE_ARCHIVE" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$NODE_ARCHIVE" -C "$RUNNER_TEMP"
          NODE_HOME="$RUNNER_TEMP/node-v${NODE_VERSION}-linux-x64"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          echo "NODE_HOME=$NODE_HOME" >> "$GITHUB_ENV"
          echo "$NODE_HOME/bin" >> "$GITHUB_PATH"

      - name: Verify exact engine and Node identities
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --version | tee "$RUNNER_TEMP/godot-version.txt"
          grep -E '^4\.7\.2' "$RUNNER_TEMP/godot-version.txt"
          node --version | tee "$RUNNER_TEMP/node-version.txt"
          test "$(cat "$RUNNER_TEMP/node-version.txt")" = 'v22.23.4'
          npm --version
          npx --version

      - name: Install and verify Black-Islands Serena pin
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/serena-venv"
          "$RUNNER_TEMP/serena-venv/bin/python" -m pip install --disable-pip-version-check --no-input \
            "serena-agent==${SERENA_VERSION}"
          "$RUNNER_TEMP/serena-venv/bin/python" - <<'PY'
          import importlib.metadata
          version = importlib.metadata.version('serena-agent')
          assert version == '2.1.0', version
          print(f'SERENA_VERSION_OK={version}')
          PY
          "$RUNNER_TEMP/serena-venv/bin/serena" --help > "$RUNNER_TEMP/serena-help.txt"
          grep -q 'start-mcp-server' "$RUNNER_TEMP/serena-help.txt"

      - name: Start Godot LSP exactly as Serena requires
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$FIXTURE" --lsp-port 6008 \
            -- --godot-mcp-lsp-port=6008 \
            >"$RUNNER_TEMP/godot-lsp.log" 2>&1 &
          LSP_PID=$!
          echo "LSP_PID=$LSP_PID" >> "$GITHUB_ENV"

          ready=false
          for _ in $(seq 1 120); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/6008' >/dev/null 2>&1; then
              ready=true
              break
            fi
            if ! kill -0 "$LSP_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/godot-lsp.log" >&2
              exit 1
            fi
            sleep 0.25
          done
          test "$ready" = true
          python3 - <<'PY'
          import socket
          with socket.create_connection(('127.0.0.1', 6008), timeout=2):
              pass
          print('GODOT_LSP_6008_OK')
          PY
          if grep -E 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/godot-lsp.log"; then
            echo 'Godot LSP/editor reported parser diagnostics' >&2
            exit 1
          fi

      - name: Stop Serena prerequisite editor cleanly
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${LSP_PID:-}" ] && kill -0 "$LSP_PID" 2>/dev/null; then
            kill "$LSP_PID" || true
            for _ in $(seq 1 40); do
              if ! kill -0 "$LSP_PID" 2>/dev/null; then
                break
              fi
              sleep 0.25
            done
            if kill -0 "$LSP_PID" 2>/dev/null; then
              kill -9 "$LSP_PID" || true
            fi
          fi
          if [ -f "$RUNNER_TEMP/godot-lsp.log" ]; then
            tail -n 80 "$RUNNER_TEMP/godot-lsp.log"
          fi

      - name: Parse/import fixture with real Godot editor
        shell: bash
        run: |
          set -euo pipefail
          timeout 90 "$GODOT_BIN" --headless --editor --path "$FIXTURE" --quit-after 2 \
            2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/godot-import.log"; then
            echo 'Godot parser/import diagnostics failed' >&2
            exit 1
          fi

      - name: Boot real fixture and run deterministic headless test
        shell: bash
        run: |
          set -euo pipefail
          timeout 60 "$GODOT_BIN" --headless --path "$FIXTURE" \
            2>&1 | tee "$RUNNER_TEMP/godot-boot.log"
          grep -q 'AMODEX_P0_08_BOOT_OK value=42' "$RUNNER_TEMP/godot-boot.log"

          timeout 60 "$GODOT_BIN" --headless --path "$FIXTURE" \
            --script res://tests/headless_test.gd \
            2>&1 | tee "$RUNNER_TEMP/godot-test.log"
          grep -q 'AMODEX_P0_08_HEADLESS_TEST_OK value=42' "$RUNNER_TEMP/godot-test.log"

      - name: Install Godot MCP addon in isolated runtime copy
        shell: bash
        run: |
          set -euo pipefail
          MCP_FIXTURE="$RUNNER_TEMP/p008-mcp-fixture"
          cp -a "$FIXTURE" "$MCP_FIXTURE"
          export GODOT_PATH="$GODOT_BIN"
          npx -y "$GODOT_MCP_PACKAGE" init \
            --project "$MCP_FIXTURE" \
            --yes \
            --agents codex \
            --no-agents-md \
            --no-claude-md \
            | tee "$RUNNER_TEMP/godot-mcp-init.log"
          test -f "$MCP_FIXTURE/addons/godot_mcp/plugin.cfg"
          grep -q 'godot_mcp' "$MCP_FIXTURE/project.godot"
          echo "MCP_FIXTURE=$MCP_FIXTURE" >> "$GITHUB_ENV"

      - name: Verify exact Godot MCP pin and addon-backed headless status
        shell: bash
        run: |
          set -euo pipefail
          npx -y "$GODOT_MCP_PACKAGE" --version | tee "$RUNNER_TEMP/godot-mcp-version.txt"
          grep -q '0.1.2' "$RUNNER_TEMP/godot-mcp-version.txt"

          python3 research/p0-08-godot-headless/mcp_probe.py \
            --npx "$NODE_HOME/bin/npx" \
            --package "$GODOT_MCP_PACKAGE" \
            --project "$MCP_FIXTURE" \
            --godot "$GODOT_BIN" \
            --require-addon \
            --require-scene-backend \
            | tee "$RUNNER_TEMP/godot-mcp-probe.json"
          grep -q '"godot_status_call_succeeded": true' "$RUNNER_TEMP/godot-mcp-probe.json"
          grep -q '"addon_installed": true' "$RUNNER_TEMP/godot-mcp-probe.json"
          if grep -q '"scene_backend": "unavailable"' "$RUNNER_TEMP/godot-mcp-probe.json"; then
            echo 'Godot MCP addon installed but headless scene backend unavailable' >&2
            exit 1
          fi

      - name: Record runner resource envelope and repository integrity
        shell: bash
        run: |
          set -euo pipefail
          echo '=== memory ==='
          free -m
          echo '=== disk ==='
          df -h .
          echo '=== tool sizes ==='
          du -sh "$RUNNER_TEMP/godot" "$NODE_HOME" "$RUNNER_TEMP/serena-venv" "$MCP_FIXTURE" || true
          echo '=== tracked diff ==='
          git diff --exit-code -- research/p0-08-godot-headless .github/workflows/stage0-godot-headless.yml
          echo 'P0-08 HEADLESS PROBE PASS'
