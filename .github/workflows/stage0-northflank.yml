name: stage0-northflank

on:
  push:
    branches:
      - stage/0-feasibility
    paths:
      - 'research/p0-06-northflank/**'
      - '.github/workflows/stage0-northflank.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  northflank-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID }}
      NORTHFLANK_REGION: europe-west

    steps:
      - name: Checkout exact Amodex revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Detect Northflank credential
        id: credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NORTHFLANK_API_TOKEN:-}" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'P0-06 Northflank credential is available.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'P0-06 BLOCKED_EXTERNAL_CREDENTIAL: add NORTHFLANK_API_TOKEN as a repository Actions secret.'
          fi

      - name: Resolve existing Northflank Sandbox project safely
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NORTHFLANK_PROJECT_ID:-}" ]; then
            echo 'Using explicitly configured NORTHFLANK_PROJECT_ID.'
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          token = os.environ["NORTHFLANK_API_TOKEN"]
          req = urllib.request.Request("https://api.northflank.com/v1/projects")
          req.add_header("Authorization", f"Bearer {token}")
          req.add_header("Content-Type", "application/json")
          req.add_header("User-Agent", "amodex-p0-06-project-resolver")

          with urllib.request.urlopen(req, timeout=30) as response:
              body = json.load(response)

          data = body.get("data") if isinstance(body, dict) else None
          if isinstance(data, list):
              projects = data
          elif isinstance(data, dict):
              projects = data.get("projects") or []
          else:
              projects = []

          projects = [
              project
              for project in projects
              if isinstance(project, dict) and project.get("id")
          ]

          if len(projects) == 0:
              print("No existing Northflank project found; probe may create its own Stage 0 project.")
              raise SystemExit(0)

          if len(projects) != 1:
              print(
                  f"Found {len(projects)} projects; refusing to choose implicitly. "
                  "Set NORTHFLANK_PROJECT_ID as a repository secret.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          project_id = str(projects[0]["id"])
          github_env = os.environ["GITHUB_ENV"]
          with open(github_env, "a", encoding="utf-8") as handle:
              handle.write(f"NORTHFLANK_PROJECT_ID={project_id}\n")

          print("Reusing the single existing Northflank project for namespaced P0-06 resources.")
          PY

      - name: Execute real Northflank Control Plane probe
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 research/p0-06-northflank/northflank_probe.py \
            --output "$RUNNER_TEMP/p0-06-result.json"
          cat "$RUNNER_TEMP/p0-06-result.json"

      - name: Assert credential did not enter tracked files
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -F "$NORTHFLANK_API_TOKEN" -- . >/tmp/amodex-nf-secret-hits 2>/dev/null; then
            echo 'Northflank credential unexpectedly found in tracked content.' >&2
            sed 's/.*/[redacted match]/' /tmp/amodex-nf-secret-hits >&2
            exit 1
          fi
          git diff --exit-code

      - name: Preserve blocked status without fabricating host evidence
        if: steps.credential.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'P0-06 remains BLOCKED_EXTERNAL_CREDENTIAL; no Northflank deployment was attempted.'
