name: stage0-hermes

on:
  push:
    branches:
      - stage/0-feasibility
    paths:
      - research/p0-02-hermes/probe.py
      - .github/workflows/stage0-hermes.yml

permissions:
  contents: read

jobs:
  hermes-authority-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Amodex exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Fetch exact Hermes upstream commit
        shell: bash
        run: |
          set -euo pipefail
          HERMES_DIR="$RUNNER_TEMP/hermes-agent"
          git init "$HERMES_DIR"
          git -C "$HERMES_DIR" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$HERMES_DIR" fetch --depth=1 origin adecc4024456b387b1518813b90bd60c82b51287
          git -C "$HERMES_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$HERMES_DIR" rev-parse HEAD)" = "adecc4024456b387b1518813b90bd60c82b51287"
          echo "HERMES_DIR=$HERMES_DIR" >> "$GITHUB_ENV"

      - name: Bootstrap Hermes supported dev environment
        shell: bash
        run: |
          set -euo pipefail
          cd "$HERMES_DIR"
          source ./activate
          python --version
          python -c 'from run_agent import AIAgent; print(AIAgent.__name__)'

      - name: Run Amodex P0-02 boundary probe
        shell: bash
        run: |
          set -euo pipefail
          cd "$HERMES_DIR"
          source ./activate
          python "$GITHUB_WORKSPACE/research/p0-02-hermes/probe.py" \
            --hermes-root "$HERMES_DIR" \
            --output "$RUNNER_TEMP/p0-02-result.json"
          cat "$RUNNER_TEMP/p0-02-result.json"
