name: stage0-provider-gemini

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-free-capability-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout exact Amodex revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Require external free-tier credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "P0-03 BLOCKED_EXTERNAL_CREDENTIAL: add a free Gemini key as repository secret GEMINI_API_KEY." >&2
            exit 2
          fi

      - name: Execute fixed free-tier capability probe
        shell: bash
        run: |
          set -euo pipefail
          python3 research/p0-03-providers/gemini_probe.py --output "$RUNNER_TEMP/p0-03-gemini-result.json"
          cat "$RUNNER_TEMP/p0-03-gemini-result.json"

      - name: Assert no secret material entered tracked files
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -F "$GEMINI_API_KEY" -- . ':!research/p0-03-providers/RESULT.md' >/tmp/amodex-secret-hits 2>/dev/null; then
            echo "Provider credential unexpectedly found in tracked content." >&2
            sed 's/.*/[redacted match]/' /tmp/amodex-secret-hits >&2
            exit 1
          fi
          git diff --exit-code
