services:
  - type: web
    name: amodex
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: sh scripts/build_render.sh
    startCommand: python scripts/start_render.py
    healthCheckPath: /healthz
    envVars:
      - key: AMODEX_SUPERVISED_ENABLED
        value: "1"
      - key: AMODEX_SUPERVISED_PROJECTS_FILE
        value: /etc/secrets/amodex-supervised-projects.json
      - key: AMODEX_APPLY_MIGRATIONS_ON_START
        value: "0"
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: AMODEX_DATABASE_URL
        sync: false
      - key: AMODEX_MIGRATION_DATABASE_URL
        sync: false
      - key: AMODEX_DATABASE_ENDPOINT_GUARD
        sync: false
      - key: AMODEX_MEDIA_STORE_BACKEND
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AMODEX_CLOUDINARY_PREFIX
        value: amodex-production
      - key: AMODEX_MEDIA_MAX_UPLOAD_BYTES
        value: "26214400"
      - key: AMODEX_ACCESS_PASSCODE
        sync: false
      - key: AMODEX_ACCESS_SESSION_SECRET
        sync: false
      - key: AMODEX_ACCESS_SESSION_TTL_SECONDS
        value: "43200"
      - key: AMODEX_THEME_COLORS
        value: "#8b5cf6"
      - key: AMODEX_THEME_MODE
        value: single
      - key: AMODEX_STT_ENABLED
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AMODEX_STT_BILLING_CLASS
        value: free
      - key: AMODEX_STT_MODEL
        value: whisper-large-v3-turbo
      - key: AMODEX_GROQ_BILLING_CLASS
        value: free
