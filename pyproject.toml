[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "amodex"
version = "0.1.0"
description = "Amodex persistent engineering-agent control plane"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[project.scripts]
amodex = "amodex.cli:main"
amodex-contract = "amodex.contracts.cli:main"
amodex-worker = "amodex.runtime.worker:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
