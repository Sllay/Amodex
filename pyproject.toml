[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "amodex"
version = "0.1.0"
description = "Amodex persistent engineering-agent control plane"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

# Opt-in host runtime for HERMES_COMMIT, tested on Python 3.13.5.
# No provider credentials, model discovery, billing grant or source checkout is installed.
supervised = [
  "openai==2.29.0",
  "python-dotenv==1.2.1",
  "rich==14.3.3",
  "fire==0.7.1",
  "tenacity==9.1.4",
  "tomli-w==1.2.0",
  "ruamel.yaml==0.18.16",
  "requests==2.32.5",
  "jinja2==3.1.6",
  "prompt-toolkit==3.0.52",
  "croniter==6.2.0",
  "snowballstemmer==3.0.1",
  "packaging==26.0",
  "truststore==0.10.4",
  "psutil==7.2.2",
]
browser-test = ["playwright==1.58.0"]

[project.scripts]
amodex = "amodex.cli:main"
amodex-contract = "amodex.contracts.cli:main"
amodex-worker = "amodex.runtime.worker:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
